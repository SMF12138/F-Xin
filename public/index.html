<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>聊天</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f5f5f5; height: 100vh; display: flex;
  flex-direction: column; max-width: 700px; margin: 0 auto;
}
header {
  background: #4a4a4a; color: #fff; padding: 12px 16px;
  display: flex; justify-content: space-between; align-items: center;
}
#status { font-size: 12px; opacity: 0.8; }
#msgs { flex: 1; overflow-y: auto; padding: 16px; }
.msg { margin-bottom: 14px; display: flex; }
.msg.me { flex-direction: row-reverse; }
.bubble {
  max-width: 75%; padding: 9px 13px; border-radius: 10px;
  font-size: 15px; line-height: 1.5; word-break: break-word;
}
.msg:not(.me) .bubble { background: #fff; }
.msg.me .bubble { background: #95ec69; }
.time { font-size: 11px; color: #999; text-align: center; margin: 12px 0; }
footer { display: flex; padding: 10px; background: #fff; border-top: 1px solid #ddd; }
input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; outline: none; }
button { padding: 0 20px; margin-left: 8px; border: none; border-radius: 6px; background: #07c160; color: #fff; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <b>聊天</b>
  <span id="status">连接中...</span>
</header>

<div id="msgs"></div>

<footer>
  <input id="input" placeholder="输入消息..." autocomplete="off">
  <button onclick="send()">发送</button>
</footer>

<script>
let ws, myName = localStorage.getItem('name');

if (!myName) {
  myName = prompt('请输入你的名字:');
  if (!myName) myName = '匿名';
  localStorage.setItem('name', myName);
}

const msgsEl = document.getElementById('msgs');
const statusEl = document.getElementById('status');
const inputEl = document.getElementById('input');

function connect() {
  ws = new WebSocket('ws://' + location.host);

  ws.onopen = () => {
    statusEl.textContent = '已连接';
    ws.send(JSON.stringify({ type: 'login', name: myName }));
  };

  ws.onclose = () => {
    statusEl.textContent = '断开，重连中...';
    setTimeout(connect, 2000);   // 断线自动重连
  };

  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);

    if (m.type === 'history') {
      m.messages.forEach(r => addMsg(r.from, r.text, r.time, false));
    }

    else if (m.type === 'msg') {
      addMsg(m.from, m.text, m.time, true);
    }

    else if (m.type === 'online') {
      statusEl.textContent = m.name + ' 在线';
    }

    else if (m.type === 'offline') {
      statusEl.textContent = m.name + ' 离线';
    }
  };
}

function addMsg(from, text, time, scroll) {
  const mine = from === myName;
  const d = new Date(time);
  const hhmm = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');

  const el = document.createElement('div');
  el.className = 'msg' + (mine ? ' me' : '');
  el.innerHTML = `<div><div class="bubble"></div><div style="font-size:11px;color:#999;margin-top:3px">${from} ${hhmm}</div></div>`;
  el.querySelector('.bubble').textContent = text;

  msgsEl.appendChild(el);
  if (scroll) msgsEl.scrollTop = msgsEl.scrollHeight;
}

function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  if (ws.readyState === 1) {
    ws.send(JSON.stringify({ type: 'msg', text }));
    inputEl.value = '';
  }
}

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') send();
});

connect();
</script>
</body>
</html>
